<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WorldCons · every fan convention and every guest</title>
    <meta name="description" content="Comic, anime, gaming, sci-fi and horror conventions worldwide, sorted by date, with every announced guest and their photo." />
    <meta name="theme-color" content="#121418" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="WorldCons" />
    <meta property="og:title" content="WorldCons" />
    <meta property="og:description" content="Every fan convention worldwide, sorted by date, with every guest's photo." />
    <meta property="og:image" content="icons/og.png" />
    <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      try {
        var t = localStorage.getItem('wc.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      THESIS: every convention is a credential you can clip to your lanyard, and every guest wears a
      photo ID, so faces sit on every badge. Refuses the Eventbrite card + pin icon + filter sidebar
      and the dark gamer-neon default.
      OWN-WORLD: cool hall-grey ground; white laminated badges with a punched lanyard slot, inset key
      art, wide-set heavy Archivo names, tabular date lines; satin type ribbons hanging from the
      badge's bottom edge in ten flat ribbon colours; guests as 4:5 photo credentials with an ink role
      band; ink is the only action colour; the black strap carries the wordmark.
      STORY: see what is on next and who is going, narrow by when/where/type, open a badge to see
      every guest's credential and the official link, clip the ones you want to your lanyard.
      FIRST VIEWPORT: black strap (wordmark left, guest/con search centre, lanyard count right);
      When segments + where selects + guests toggle + sort; type ribbons; sticky month ruler with
      counts; then the first month heading over a 4-up badge grid, the nearest con first with its
      countdown chip. Primary action: open a badge.
      FORM: con badge and lanyard (credential ephemera), #4 of 7, seed b0664257. Raises: scale-only
      hierarchy (type specimen); a guest index pointing into every badge (star atlas); registered
      identical badges and punched-corner state for ended cons (botanical folio); ink reserved for
      pressable things and a thumb-reach filter sheet (consumer app); right-aligned tabular day counts,
      names never overflow (j-card).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the
      verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <a class="skip" href="#main">Skip to conventions</a>
    <header class="strap">
      <a class="brand" href="#/" aria-label="WorldCons home">
        <svg class="brand-mark" viewBox="0 0 26 30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 1.5 13 11l9-9.5" />
          <circle cx="13" cy="12.6" r="1.6" />
          <rect x="5" y="15.5" width="16" height="13" rx="2.4" />
          <path d="M9.5 21h7M9.5 24.5h4.5" />
        </svg>
        <span>WORLD<b>CONS</b></span>
      </a>
      <div class="search" role="search">
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search cons, cities, guests" aria-label="Search conventions, cities or guests" aria-controls="suggest" aria-expanded="false" aria-autocomplete="list" />
        <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
        <button class="clear" type="button" aria-label="Clear search" hidden><svg class="icon" aria-hidden="true"><use href="#i-x" /></svg></button>
        <div class="suggest" id="suggest" role="listbox" aria-label="Suggestions" hidden></div>
      </div>
      <a class="lanyard-link" href="#/lanyard" aria-label="Your lanyard">
        <svg class="icon" aria-hidden="true"><use href="#i-lanyard" /></svg>
        <span class="label">Lanyard</span>
        <span class="count" data-n="0">0</span>
      </a>
    </header>

    <main id="main" tabindex="-1">
      <section id="view-list" aria-label="Conventions">
        <div class="controls" id="controls"></div>
        <div class="ribbon-row" id="ribbon-row" role="group" aria-label="Convention types"></div>
        <nav class="ruler" id="ruler" aria-label="Months"></nav>
        <p class="results" id="results" aria-live="polite"></p>
        <div id="groups"></div>
      </section>
      <section id="view-page" hidden></section>
    </main>

    <footer class="foot">
      <p id="foot-data">Dates and guests come from each convention's official website. Plans change, so confirm with the con before you travel. Guest photos belong to their owners and are shown to identify who is appearing.</p>
      <p><button type="button" id="theme-btn">Theme: auto</button></p>
    </footer>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
      <form method="dialog" class="sheet-inner" id="sheet-form"></form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
